<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Focus Warning</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <img src="illitmoka.gif" alt="GIF" onerror="this.src='pet.gif'">
</body>
</html>
